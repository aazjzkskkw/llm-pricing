<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>按厂商看 — LLM 价格对比</title>
<link rel="stylesheet" href="style.css">
<style>
  .vcard { background:var(--card); border:1px solid var(--line); border-radius:14px;
           padding:16px 18px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .vcard h3 { margin:0 0 2px; font-size:16px; display:flex; align-items:center; gap:6px; }
  .vcard .sum { color:var(--dim); font-size:12px; margin-bottom:10px; }
  .mlist { display:flex; flex-direction:column; gap:1px; }
  .mrow { display:flex; justify-content:space-between; gap:10px; font-size:13px;
          padding:3px 0; border-bottom:1px dashed var(--line); }
  .mrow:last-child { border-bottom:none; }
  .mrow span:first-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mrow i { color:var(--dim); font-style:normal; font-size:11px; margin-left:6px; }
  .mrow b { font-weight:500; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .more { display:inline-block; margin-top:8px; margin-right:12px; font-size:12px; text-decoration:none; }
  .more:hover { text-decoration:underline; }
</style>
</head>
<body>
<header>
  <div class="eyebrow">VENDORS</div>
  <h1>按厂商看</h1>
  <div class="meta">每家的价格区间与最新模型 · 灰条是全站价格范围，实色段是这家的位置 · 更新于 <span id="updated">…</span></div>
</header>
<nav></nav>
<div class="bar">
  <input id="q" type="search" placeholder="搜厂商名，如 openai、智谱、通义…">
  <select id="src">
    <option value="1">仅厂商官方</option>
    <option value="">全部（含聚合平台）</option>
    <option value="0">仅聚合平台</option>
  </select>
  <select id="sort">
    <option value="new">按最近发布排序</option>
    <option value="cheap">按最低价排序</option>
    <option value="count">按模型数排序</option>
    <option value="name">按名称排序</option>
  </select>
</div>
<p class="count" id="count"></p>
<div class="grid" id="grid"></div>
<p class="note">美元 / 100 万 token，卡片内按发布时间倒序。</p>

<script src="app.js?v=6"></script>
<script>
let models = [], pages = {};
const fmt$ = money;   // app.js


fetch('data/models.json').then(r => r.json()).then(d => {
  document.getElementById('updated').textContent = d.updated_at;
  pages = d.pricing_pages || {};
  // 只留有价格的 chat 模型：向量/语音的价格量纲不同，混一起算区间没意义
  models = d.models.filter(m => m.mode === 'chat' && m.input != null);
  render();
});

['q','src','sort'].forEach(id =>
  document.getElementById(id).addEventListener('input', render));

function render() {
  const q = document.getElementById('q').value.toLowerCase();
  const src = document.getElementById('src').value;
  const by = document.getElementById('sort').value;

  // 分组要在筛选之后做：同一个品牌下既有官方直营价也有平台转售价
  const groups = new Map();
  for (const m of models) {
    if (src !== '' && String(+m.official) !== src) continue;
    if (q && !m.vendor_name.toLowerCase().includes(q)) continue;
    const g = groups.get(m.vendor_name)
      || { name: m.vendor_name, chat: [], hasOfficial: false };
    g.chat.push(m);
    if (m.official) g.hasOfficial = true;
    groups.set(m.vendor_name, g);
  }
  const vs = [...groups.values()];
  for (const g of vs) {
    // 卡片里按发布时间倒序，没有日期的排后面
    g.chat.sort((a, b) => (b.released || '').localeCompare(a.released || '') || a.input - b.input);
    g.latest = g.chat.find(m => m.released)?.released || null;
    const prices = g.chat.map(m => m.input);
    g.min = Math.min(...prices); g.max = Math.max(...prices);
  }
  // 区间柱要在同一把尺子上比，先取所有厂商的价格上下限
  const gmin = Math.min(...vs.map(g => g.min), Infinity) || 0.01;
  const gmax = Math.max(...vs.map(g => g.max), 1);
  vs.sort(by === 'count' ? (a, b) => b.chat.length - a.chat.length
        : by === 'name' ? (a, b) => a.name.localeCompare(b.name)
        : by === 'cheap' ? (a, b) => a.min - b.min
        : (a, b) => (b.latest || '').localeCompare(a.latest || ''));

  document.getElementById('count').textContent = `共 ${vs.length} 家`;
  document.getElementById('grid').innerHTML = vs.map(g => {
    const top = g.chat.slice(0, 6).map(m => `<div class="mrow">
        <span title="${m.model}">${m.model.split('/').pop()}${
          m.released ? `<i>${m.released.slice(0, 7)}</i>` : ''}</span>
        <b class="${tier(m.input)}">${fmt$(m.input)}</b> <span class="unit">/</span>
        <b class="${tier(m.output)}">${fmt$(m.output)}</b></div>`).join('');
    const page = pages[g.name];
    return `<div class="vcard">
      ${logo('', g.name)}
      <h3>${g.name}${g.hasOfficial ? '' : '<span class="tag blue">平台</span>'}</h3>
      <div class="sum">${g.chat.length} 个模型${g.latest ? ` · 最近 ${g.latest}` : ''}</div>
      ${rangeBar(logPct(g.min, gmin, gmax), logPct(g.max, gmin, gmax), 0, 100)}
      <div class="sum"><b>${fmt$(g.min)}</b> ~ <b>${fmt$(g.max)}</b>
        <span class="unit">/ 1M 输入</span></div>
      <div class="mlist">${top}</div>
      <a class="more" href="index.html?vendor=${encodeURIComponent(g.name)}">在总表里看这家 →</a>
      ${page ? `<a class="more" href="${page}" target="_blank" rel="noopener">官方价格页 ↗</a>` : ''}
    </div>`;
  }).join('');
}
</script>
</body>
</html>
