<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM 价格对比 — 各厂商大模型官方定价 vs 聚合平台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="eyebrow">MODEL PRICING</div>
  <h1>LLM 价格对比</h1>
  <div class="meta">厂商官方直营价与聚合平台转售价并列，单位为美元 / 100 万 token。数据源：<span id="srcs">…</span>。更新于 <b id="updated">…</b></div>
</header>
<nav></nav>

<div class="stats" id="stats"></div>

<div class="bar">
  <input id="q" type="search" placeholder="搜索模型名，如 gpt、claude、deepseek、qwen…">
  <select id="official">
    <option value="">全部来源</option>
    <option value="1">仅官方直营</option>
    <option value="0">仅聚合平台</option>
  </select>
  <select id="channel"><option value="">全部渠道</option></select>
  <select id="vendor"><option value="">全部厂商</option></select>
  <select id="mode">
    <option value="">全部类型</option>
    <option value="chat">对话</option>
    <option value="embedding">向量</option>
    <option value="audio">语音</option>
    <option value="image">图像</option>
  </select>
  <select id="priced">
    <option value="">含未公布价格</option>
    <option value="1">仅已公布价格</option>
  </select>
  <select id="range">
    <option value="fresh">近一年发布</option>
    <option value="all">全部（含一年前，扩展）</option>
  </select>
  <select id="tier">
    <option value="">全部模型</option>
    <option value="1">只看各厂旗舰</option>
  </select>
  <select id="sortsel">
    <option value="flagship">旗舰优先</option>
    <option value="key">按模型分组（跨渠道比价）</option>
    <option value="vendor_name">按厂商</option>
    <option value="released">按最近发布</option>
    <option value="input">按输入价从低到高</option>
  </select>
  <select id="dedup">
    <option value="">显示每个渠道</option>
    <option value="1">每个模型只留最便宜渠道</option>
  </select>
</div>
<p class="count" id="count"></p>
<table id="tbl">
  <thead><tr>
    <th data-k="vendor_name">厂商</th>
    <th data-k="model">模型</th>
    <th data-k="channel">渠道</th>
    <th data-k="input" class="num">输入 $/1M</th>
    <th data-k="output" class="num">输出 $/1M</th>
    <th data-k="cache_read" class="num">缓存读 $/1M</th>
    <th data-k="context" class="num">上下文</th>
    <th data-k="released">发布</th>
    <th>类型</th>
  </tr></thead>
  <tbody></tbody>
</table>

<script src="app.js?v=3"></script>
<script>
let models = [], sortKey = 'flagship', sortAsc = true;
// 统一的「渠道」概念：补充行看 via，主源里平台自己就是渠道，其余算厂商直营
const chanOf = m => m.via || (m.official ? '官方直营' : m.vendor_name);
const fmtN = v => v == null ? '<span class="na">-</span>' : v.toLocaleString();
const vendorSel = document.getElementById('vendor');

fetch('data/models.json').then(r => r.json()).then(async d => {
  models = d.models;
  document.getElementById('updated').textContent = d.updated_at;
  document.getElementById('srcs').innerHTML = (d.sources || [])
    .map(s => `<a href="${s.url}" target="_blank">${s.name}</a><span class="dim">（${s.role}）</span>`)
    .join('、');
  const vs = [...new Set(models.map(m => m.vendor_name))].sort();
  vendorSel.innerHTML += vs.map(v => `<option>${v}</option>`).join('');
  const chans = [...new Set(models.map(chanOf))].sort();
  document.getElementById('channel').innerHTML +=
    chans.map(c => `<option>${c}</option>`).join('');
  const qs = new URLSearchParams(location.search);
  const preset = qs.get('vendor');
  if (preset && vs.includes(preset)) vendorSel.value = preset;
  if (qs.get('range') === 'all') document.getElementById('range').value = 'all';
  await markFlagships(models);       // app.js：拿 ECI 榜单标旗舰
  stats(d, vs.length);
  render();
});

function stats(d, vendors) {
  const chat = models.filter(m => m.mode === 'chat' && m.input != null);
  const freeN = chat.filter(m => m.input === 0).length;
  const newest = models.filter(m => m.released)
    .sort((a, b) => b.released.localeCompare(a.released))[0];
  // 上游偶尔把生图模型标成 chat，卡个上下文门槛把它们排掉，免得「最低价」是张图
  const cheapest = chat.filter(m => m.input > 0 && (m.context || 0) >= 16000)
    .sort((a, b) => a.input - b.input)[0];
  const okN = models.filter(m => (m.xref || {}).verdict === 'ok').length;
  const unkN = models.filter(m => (m.xref || {}).verdict === 'unknown').length;
  document.getElementById('stats').innerHTML = [
    ['收录模型', d.count.toLocaleString(), `${vendors} 家厂商与平台`],
    ['免费档', freeN, '对话模型标价 0'],
    ['最低付费价', money(cheapest.input), cheapest.model.split('/').pop()],
    ['最新发布', newest.released, newest.model.split('/').pop()],
    ['补充渠道', (d.channels || []).length, '同一模型可跨渠道比价'],
    ['价格核对', `${okN} / ${okN + unkN}`, okN + unkN ? '已对过官网 / 有争议的条数' : '无争议'],
  ].map(([k, n, s]) => `<div class="stat"><div class="k">${k}</div>
      <div class="n">${n}</div><div class="s">${s}</div></div>`).join('');
}

['q','vendor','mode','priced','official','channel','dedup','range','tier'].forEach(id =>
  document.getElementById(id).addEventListener('input', render));
document.getElementById('sortsel').addEventListener('input', e => {
  sortKey = e.target.value;
  sortAsc = sortKey !== 'released';
  render();
});
document.querySelectorAll('th[data-k]').forEach(th =>
  th.onclick = () => {
    const k = th.dataset.k;
    sortAsc = sortKey === k ? !sortAsc : k !== 'released';
    sortKey = k;
    document.getElementById('sortsel').value =
      ['key','vendor_name','released','input'].includes(k) ? k : 'flagship';
    render();
  });

function rows() {
  const q = document.getElementById('q').value.toLowerCase();
  const qk = q.replace(/[:._]/g, '-');
  const v = vendorSel.value, mode = document.getElementById('mode').value;
  const priced = document.getElementById('priced').value;
  const official = document.getElementById('official').value;
  const ch = document.getElementById('channel').value;
  const dedup = document.getElementById('dedup').value;
  const showAged = document.getElementById('range').value === 'all';
  const onlyTop = document.getElementById('tier').value;
  let rs = models.filter(m =>
    (showAged || !m.aged) &&
    (!onlyTop || m.flagship) &&
    (!ch || chanOf(m) === ch) &&
    // 也拿分组键匹配一次：搜 glm-5.3 才能带出 Fireworks 那种 glm-5p3 的写法
    (!q || m.model.toLowerCase().includes(q) || m.vendor_name.toLowerCase().includes(q)
        || (m.key || '').includes(qk)) &&
    (!v || m.vendor_name === v) &&
    (!mode || m.mode === mode) &&
    (!priced || m.input != null) &&
    (official === '' || String(+m.official) === official));

  // 同一个模型统计有几个渠道、最低价多少，分组视图和「最便宜」标记都用它
  const groups = new Map();
  for (const m of rs) {
    const g = groups.get(m.key) || { n: 0, min: Infinity };
    g.n++;
    if (m.input != null && m.input < g.min) g.min = m.input;
    groups.set(m.key, g);
  }
  if (dedup) {                       // 每个模型只留最便宜的那一行
    const kept = new Set();
    rs = rs.filter(m => m.input != null && m.input === groups.get(m.key).min
                     && !kept.has(m.key) && kept.add(m.key));
  }
  rs.sort((a, b) => {
    if (sortKey === 'flagship') {    // 旗舰在前，有能力分的按分数从高到低
      const f = (b.flagship ? 1 : 0) - (a.flagship ? 1 : 0);
      if (f) return f;
      const e = (b.eci ?? -1) - (a.eci ?? -1);
      if (e) return e;
      return a.vendor_name.localeCompare(b.vendor_name)
          || String(a.key).localeCompare(String(b.key))
          || (a.input ?? 9e9) - (b.input ?? 9e9);
    }
    if (sortKey === 'key') {         // 分组视图：同模型排在一起，组内按价格升序
      const c = String(a.key).localeCompare(String(b.key));
      if (c) return sortAsc ? c : -c;
      return (a.input ?? 9e9) - (b.input ?? 9e9);
    }
    let x = a[sortKey], y = b[sortKey];
    if (sortKey === 'channel') { x = chanOf(a); y = chanOf(b); }
    if (x == null) return 1; if (y == null) return -1;   // 未公布排最后
    if (typeof x === 'number') return sortAsc ? x - y : y - x;
    return sortAsc ? String(x).localeCompare(y) : String(y).localeCompare(x);
  });
  return [rs, groups];
}

function priceCell(v, m, main) {
  let extra = '';
  if (main && m.suspect)
    extra += '<span class="tag red" title="价格量级异常，疑为上游数据源单位填写错误（每千 token 误填为每 token），请以厂商官方价格为准">异常</span>';
  if (main && m.xref) {
    const x = m.xref, others = (x.others || []).map(o => `${o.src} $${o.input}`).join('，');
    if (x.verdict === 'ok')
      extra += `<span class="tag ok" title="${x.checked} 核对过官网：${x.note}${
        others ? ' ｜ 其他库报价：' + others : ''}">已核对官网</span>`;
    else
      extra += `<span class="tag orange" title="其他价格库报价：${others}。多半是分档口径不同（高峰/低谷、缓存命中），也可能有一方过期。点厂商的官方价格页自己确认一下">待核对</span>`;
  }
  return `<td class="num ${tier(v)}">${money(v)}${extra}</td>`;
}

function render() {
  const [rs, groups] = rows();
  const grouped = sortKey === 'key' && !document.getElementById('dedup').value;
  const multi = [...groups.values()].filter(g => g.n > 1).length;
  document.getElementById('count').innerHTML =
    `默认只看近一年发布的对话模型，更早的切「全部」查看。当前 <b>${rs.length}</b> 行，
     归为 <b>${groups.size}</b> 个模型，其中 <b>${multi}</b> 个有两个以上渠道可比价。`;
  let prev = null;
  document.querySelector('#tbl tbody').innerHTML = rs.map(m => {
    const g = groups.get(m.key);
    const head = grouped && m.key !== prev;        // 每组第一行加分隔线和渠道数
    prev = m.key;
    // 组内同价的行很多，只给第一行打「最低价」，不然一片标签没信息量
    const cheapest = g.n > 1 && m.input != null && m.input === g.min && !g.marked
      && (g.marked = true);
    return `<tr${head ? ' class="gstart"' : ''}><td>${m.vendor_name}</td>
    <td>${m.model}${
      m.flagship ? `<span class="tag star" title="${m.eci != null
        ? 'Epoch ECI 综合能力分 ' + m.eci + '，本厂前三'
        : '该厂商当前价位最高的型号（未上 ECI 榜，用价格代理）'}">旗舰</span>` : ''}${
      m.aged ? '<span class="tag gray" title="发布超过一年，默认不在主表里">扩展</span>' : ''}${
      g.n > 1 && head ? `<span class="tag gray">${g.n} 个渠道</span>` : ''}${
      cheapest ? '<span class="tag ok">最低价</span>' : ''}${
      m.new ? '<span class="tag green">新</span>' : ''}${
      m.vision ? '<span class="tag blue">视觉</span>' : ''}${
      m.reasoning ? '<span class="tag blue">推理</span>' : ''}${
      m.tool_call ? '<span class="tag blue">工具</span>' : ''}</td>
    <td class="v">${m.via ? `<span class="tag orange">经 ${m.via}</span>`
      : m.official ? '<span class="tag ok">官方直营</span>'
      : `<span class="tag blue">${m.vendor_name}</span>`}</td>
    ${priceCell(m.input, m, true)}
    ${priceCell(m.output, m, false)}
    ${priceCell(m.cache_read, m, false)}
    <td class="num">${fmtN(m.context)}</td>
    <td class="v">${m.released || '<span class="na">-</span>'}</td>
    <td class="v">${m.mode || ''}</td></tr>`;
  }).join('');
}
</script>
</body>
</html>
