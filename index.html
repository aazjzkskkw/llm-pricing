<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM 价格对比 — 各厂商大模型官方定价 vs 聚合平台</title>
<style>
  :root { --bg:#f5f7fa; --card:#ffffff; --fg:#1c2128; --dim:#6b7280; --line:#e4e8ee;
          --accent:#2563eb; --accent-bg:#eff4ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  header { padding:28px 20px 4px; max-width:1400px; margin:0 auto; }
  h1 { font-size:24px; margin:0 0 4px; }
  .meta { color:var(--dim); font-size:13px; }
  .meta a { color:var(--accent); text-decoration:none; }
  .meta a:hover { text-decoration:underline; }
  .nav { max-width:1400px; margin:0 auto; padding:0 20px; }
  .nav a.promo { display:inline-block; margin-top:10px; padding:6px 14px; border-radius:20px;
         background:linear-gradient(90deg,#eff4ff,#fef4e6); color:#c2410c; font-size:13px;
         text-decoration:none; border:1px solid #fde0c3; }
  .nav a.promo:hover { filter:brightness(.97); }
  .bar { max-width:1400px; margin:14px auto; padding:0 20px;
         display:flex; gap:10px; flex-wrap:wrap; position:sticky; top:0;
         background:var(--bg); padding-bottom:12px; z-index:5; }
  input, select { background:var(--card); color:var(--fg); border:1px solid var(--line);
         border-radius:10px; padding:8px 12px; font-size:14px; }
  input { flex:1; min-width:220px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  input:focus, select:focus { outline:2px solid var(--accent-bg); border-color:var(--accent); }
  table { width:100%; max-width:1400px; margin:0 auto 40px; border-collapse:separate;
          border-spacing:0; background:var(--card); border:1px solid var(--line);
          border-radius:12px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  th, td { padding:9px 14px; border-bottom:1px solid var(--line); text-align:left;
           white-space:nowrap; }
  th { color:var(--dim); font-weight:600; cursor:pointer; user-select:none;
       position:sticky; top:58px; background:var(--card); font-size:13px; }
  th.num, td.num { text-align:right; font-variant-numeric:tabular-nums; }
  tr:last-child td { border-bottom:none; }
  tr:hover td { background:#f7f9fc; }
  .v { color:var(--dim); }
  .tag { display:inline-block; font-size:11px; border-radius:4px; padding:0 6px;
         margin-left:5px; line-height:18px; vertical-align:1px; }
  .tag.blue { color:var(--accent); background:var(--accent-bg); }
  .tag.orange { color:#c2410c; background:#fff3e8; }
  .tag.green { color:#15803d; background:#e9f9ef; }
  .free { color:#15803d; font-weight:600; }
  .na { color:#b0b7c3; }
  #count { color:var(--dim); font-size:13px; margin:0 20px 8px; max-width:1400px; }
</style>
</head>
<body>
<header>
  <h1>LLM 价格对比</h1>
  <div class="meta">数据来自 <a href="https://github.com/BerriAI/litellm/blob/main/model_prices_and_context_window.json" target="_blank">LiteLLM 官方价格库</a>，最新模型由 <a href="https://openrouter.ai/docs" target="_blank">OpenRouter</a> 补充，单位：美元 / 100 万 token。更新：<span id="updated">…</span></div>
</header>
<div class="nav"><a class="promo" href="promos.html">🎁 厂商活动 &amp; 平台优惠</a></div>
<div class="bar">
  <input id="q" type="search" placeholder="搜索模型名，如 gpt、claude、deepseek、qwen…">
  <select id="official">
    <option value="">全部来源</option>
    <option value="1">仅官方直营</option>
    <option value="0">仅聚合平台</option>
  </select>
  <select id="vendor"><option value="">全部厂商</option></select>
  <select id="mode">
    <option value="">全部类型</option>
    <option value="chat">对话</option>
    <option value="embedding">向量</option>
    <option value="audio">语音</option>
    <option value="image">图像</option>
  </select>
  <select id="priced">
    <option value="">含未公布价格</option>
    <option value="1">仅已公布价格</option>
  </select>
</div>
<p id="count"></p>
<table id="tbl">
  <thead><tr>
    <th data-k="vendor_name">厂商</th>
    <th data-k="model">模型</th>
    <th data-k="input" class="num">输入 $/1M</th>
    <th data-k="output" class="num">输出 $/1M</th>
    <th data-k="cache_read" class="num">缓存读 $/1M</th>
    <th data-k="context" class="num">上下文</th>
    <th>特性</th>
  </tr></thead>
  <tbody></tbody>
</table>

<script>
let models = [], sortKey = 'vendor_name', sortAsc = true;

const fmt$ = v => v == null ? '<span class="na">未公布</span>'
  : v === 0 ? '<span class="free">免费</span>'
  : v < 0.01 ? '$' + v.toFixed(4) : '$' + (+v.toFixed(2));
const fmtN = v => v == null ? '<span class="na">-</span>' : v.toLocaleString();

fetch('data/models.json').then(r => r.json()).then(d => {
  models = d.models;
  document.getElementById('updated').textContent = d.updated_at;
  const vs = [...new Set(models.map(m => m.vendor_name))].sort();
  vendorSel.innerHTML += vs.map(v => `<option>${v}</option>`).join('');
  render();
});

const vendorSel = document.getElementById('vendor');
['q','vendor','mode','priced','official'].forEach(id =>
  document.getElementById(id).addEventListener('input', render));
document.querySelectorAll('th[data-k]').forEach(th =>
  th.onclick = () => {
    const k = th.dataset.k;
    sortAsc = sortKey === k ? !sortAsc : true; sortKey = k; render();
  });

function rows() {
  const q = document.getElementById('q').value.toLowerCase();
  const v = vendorSel.value, mode = document.getElementById('mode').value;
  const priced = document.getElementById('priced').value;
  const official = document.getElementById('official').value;
  let rs = models.filter(m =>
    (!q || m.model.toLowerCase().includes(q) || m.vendor_name.toLowerCase().includes(q)) &&
    (!v || m.vendor_name === v) &&
    (!mode || m.mode === mode) &&
    (!priced || m.input != null) &&
    (official === '' || String(+m.official) === official));
  rs.sort((a, b) => {
    let x = a[sortKey], y = b[sortKey];
    if (x == null) return 1; if (y == null) return -1;   // 未公布排最后
    if (typeof x === 'number') return sortAsc ? x - y : y - x;
    return sortAsc ? String(x).localeCompare(y) : String(y).localeCompare(x);
  });
  return rs;
}

function render() {
  const rs = rows();
  document.getElementById('count').textContent = `共 ${rs.length} 个模型（点击列头排序，按价格列排序可对比同一模型在各平台的定价差异）`;
  document.querySelector('#tbl tbody').innerHTML = rs.map(m =>
    `<tr><td>${m.vendor_name}${m.official ? '' : '<span class="tag blue">平台</span>'}</td><td>${m.model}${
      m.new ? '<span class="tag green">新</span>' : ''}${
      m.vision ? '<span class="tag blue">视觉</span>' : ''}${
      m.reasoning ? '<span class="tag blue">推理</span>' : ''}${
      m.tool_call ? '<span class="tag blue">工具</span>' : ''}</td>
    <td class="num">${fmt$(m.input)}</td>
    <td class="num">${fmt$(m.output)}</td>
    <td class="num">${fmt$(m.cache_read)}</td>
    <td class="num">${fmtN(m.context)}</td>
    <td class="v">${m.mode || ''}</td></tr>`).join('');
}
</script>
</body>
</html>
