<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>厂商活动 & 平台优惠 — LLM 价格对比</title>
<link rel="stylesheet" href="style.css">
<style>
  h2 { max-width:var(--max); margin:26px auto 2px; padding:0 20px; font-size:17px; }
  h2 small { font-weight:400; font-size:13px; color:var(--dim); margin-left:8px; }
  .card { display:flex; flex-direction:column; gap:4px; }
  .card .desc { flex:1; }
  .card .kind { font-size:12px; font-weight:600; }
  .k-free { color:#15803d; }
  .k-credit { color:#c2410c; }
  .k-trial { color:var(--accent); }
</style>
</head>
<body>
<header>
  <div class="eyebrow">PROMOTIONS</div>
  <h1>活动与优惠</h1>
  <div class="meta">厂商与平台的免费额度及优惠入口，按优惠力度排列。</div>
</header>
<nav></nav>
<h2 class="sec">长期免费<small>长期有效，注册即可使用</small></h2>
<div class="grid" id="free"></div>
<h2 class="sec">赠送额度<small>新用户一次性赠送，用完即止</small></h2>
<div class="grid" id="credit"></div>
<h2 class="sec">其他优惠<small>批量接口折扣、提示缓存降价、限时活动</small></h2>
<div class="grid" id="trial"></div>
<p class="note">活动与额度可能随时调整，以各站点公告为准。补充或纠正请编辑本页 PROMOS 数组并提交 PR。</p>

<script src="app.js?v=2"></script>
<script>

  { kind: 'free', name: 'Cerebras', who: '聚合平台', desc: '免费档开放多款开源模型，同样以速度为主要优势。', url: 'https://cloud.cerebras.ai/' },
  { kind: 'free', name: 'GitHub Models', who: '聚合平台', desc: 'GitHub 账号即可调用主流闭源模型，有速率限制。', url: 'https://github.com/marketplace/models' },

  { kind: 'free', name: '智谱 GLM Flash 系列', who: '智谱', desc: 'GLM-4.5-Flash 等 Flash 型号官方定价为 0，价格总表可查。', url: 'https://open.bigmodel.cn/pricing' },
  { kind: 'free', name: 'Google AI Studio', who: 'Google', desc: 'Gemini 提供免费档，可在网页端直接调用，适合开发调试。', url: 'https://aistudio.google.com/' },
  // —— 送额度 ——
  { kind: 'credit', name: '阿里云百炼', who: '阿里', desc: '通义千问系列新用户每款模型赠送百万级 token，覆盖模型较多。', url: 'https://bailian.console.aliyun.com/' },

  { kind: 'credit', name: '阶跃星辰', who: '阶跃', desc: 'Step 系列注册赠送额度。', url: 'https://platform.stepfun.com/' },

for (const p of PROMOS) {
  document.getElementById(p.kind).insertAdjacentHTML('beforeend', `
    <div class="card">
      ${logo('', p.name)}
      <div class="kind k-${p.kind}">${LABEL[p.kind]} · <span class="v">${p.who}</span></div>
      <div class="name">${p.name}</div>
      <div class="desc">${p.desc}</div>
      <a href="${p.url}" target="_blank" rel="noopener">前往查看 →</a></div>`);
}
</script>
</body>
</html>
