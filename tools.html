<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>订阅与渠道 — LLM 价格对比</title>
<link rel="stylesheet" href="style.css">
<style>
  .plans { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .plan { border:1px solid var(--line); border-radius:8px; padding:4px 9px;
          font-size:12.5px; background:#fbfcfe; }
  .plan b { font-variant-numeric:tabular-nums; white-space:nowrap; }
  .plan.free b { color:var(--ok); }
  .inc { color:var(--dim); font-size:11.5px; }
</style>
</head>
<body>
<div class="hero">
<header>
  <div class="eyebrow">SUBSCRIPTIONS &amp; CHANNELS</div>
  <h1>订阅与<em>渠道</em></h1>
  <div class="meta">编程工具订阅档位（逐个核对过官网）与聚合平台规模 · 平台数据由价格总表实时算出</div>
</header>
<nav></nav>
</div>

<h2 class="sec"><span class="eyebrow">CODING TOOLS</span>AI 编程工具订阅<small>月费与包含额度，按月付标价</small></h2>
<p class="lead">柱长按最贵档缩放，跨产品可横比。额度单位各家不同，超出后基本转按量计费。</p>
<div class="grid" id="tools"></div>

<h2 class="sec"><span class="eyebrow">AGGREGATORS</span>聚合平台<small>同一批模型的转售渠道，按模型数排序</small></h2>
<p class="lead">灰条为全站价格范围，实色段是该平台的区间。</p>
<div class="grid" id="aggs"></div>

<p class="note">订阅制工具的额度换算口径不统一，跨产品比较仅供参考。聚合平台价格为其转售价，与厂商官方直营价可能有差异，可在<a href="index.html">价格总表</a>按模型名搜索逐一对比。</p>

<script src="app.js?v=8"></script>
<script>
// 订阅档位：2026-09-03 逐个核对官网标价。改这里增删产品。
const TOOLS = [
  { name: 'Cursor', vendor: 'Anysphere', icon: 'cursor', url: 'https://www.cursor.com/pricing',
    plans: [['Hobby', 0, '有限 Agent 请求'], ['Pro', 20, '扩展额度 + 按量计费'], ['Teams', 40, '每席位 / 月']] },
  { name: 'GitHub Copilot', vendor: 'GitHub', icon: 'github', url: 'https://docs.github.com/en/copilot/about-github-copilot/plans-for-github-copilot',
    plans: [['Free', 0, '基础额度'], ['Pro', 10, '1,000 基础 credits'], ['Pro+', 39, '3,900 credits'], ['Max', 100, '10,000 credits'], ['Business', 19, '每席位 1,900 credits'], ['Enterprise', 39, '每席位 3,900 credits']] },
  { name: 'Claude', vendor: 'Anthropic', icon: 'anthropic', url: 'https://claude.com/pricing',
    plans: [['Free', 0, ''], ['Pro', 20, '年付 $17/月'], ['Max', 100, '起，用量更高'], ['Team', 25, '席位年付 $20'], ['Team Premium', 125, '席位年付 $100，含 Claude Code']] },
  { name: 'Kiro', vendor: 'AWS', icon: 'amazonaws', url: 'https://kiro.dev/pricing/',
    plans: [['Free', 0, '50 credits'], ['Pro', 20, '1,000 credits'], ['Pro+', 40, '2,000 credits'], ['Pro Max', 100, '5,000 credits'], ['Power', 200, '10,000 credits']] },
  { name: 'Trae', vendor: '字节跳动', icon: 'bytedance', url: 'https://www.trae.ai/pricing',
    plans: [['Free', 0, '有限用量'], ['Lite', 3, '含 $5 用量'], ['Pro', 10, '含 $20 用量'], ['Pro+', 30, '含 $90 用量'], ['Ultra', 100, '含 $400 用量']] },
  { name: 'Zed', vendor: 'Zed Industries', icon: 'zedindustries', url: 'https://zed.dev/pricing',
    plans: [['Personal', 0, '编辑器免费'], ['Pro', 10, '含 $5 token 额度'], ['Business', 30, '每席位 / 月']] },
  { name: 'Augment Code', vendor: 'Augment', icon: '', url: 'https://www.augmentcode.com/pricing',
    plans: [['Standard', 20, '整团队一价，含 $20 用量'], ['Business', 100, '整团队一价，含 $100 用量']] },
  { name: 'v0', vendor: 'Vercel', icon: 'vercel', url: 'https://v0.dev/pricing',
    plans: [['Free', 0, '含 $5 credits'], ['Plus', 30, '含 $30 credits / 席位'], ['Business', 100, '含 $30 credits / 席位']] },
  { name: 'Cline', vendor: 'Cline', icon: '', url: 'https://cline.bot/pricing',
    plans: [['自带 Key', 0, '开源，按厂商原价计费'], ['ClinePass', null, '官方托管额度，见官网']] },
];

// 所有工具里最贵的档，柱子按它缩放，跨产品也能横着比
const PMAX = Math.max(...TOOLS.flatMap(t => t.plans.map(p => p[1] || 0)), 1);
const planRow = ([name, price, note]) => `<div class="row">
  <span class="nm">${name}${note ? `<span class="inc"> ${note}</span>` : ''}</span>
  ${bar(price ? price / PMAX * 100 : 1.5,
        price === null ? '按量' : price === 0 ? '免费' : '$' + price)}</div>`;

document.getElementById('tools').innerHTML = TOOLS.map(t => `
  <div class="card">
    ${logo(t.icon, t.name)}
    <div class="name">${t.name}<span class="tag gray">${t.vendor}</span></div>
    ${t.plans.map(planRow).join('')}
    <a href="${t.url}" target="_blank" rel="noopener">官方定价页 →</a>
  </div>`).join('');

// 聚合平台：直接拿价格总表算，不手工维护
fetch('data/models.json').then(r => r.json()).then(d => {
  const pages = d.pricing_pages || {};
  const by = new Map();
  for (const m of d.models) {
    // 只要平台转售价；suspect 的离谱价会把区间撑坏，排掉
    if (m.official || m.mode !== 'chat' || m.input == null || m.suspect) continue;
    // via 记的是真正在收钱的平台（这类行的 vendor_name 是模型品牌，不是平台）
    const key = m.via || m.vendor_name;
    const g = by.get(key) || { name: key, prices: [], free: 0, latest: '' };
    g.prices.push(m.input);
    if (m.input === 0) g.free++;
    if ((m.released || '') > g.latest) g.latest = m.released || '';
    by.set(key, g);
  }
  const gs = [...by.values()].filter(g => g.prices.length >= 3)
    .sort((a, b) => b.prices.length - a.prices.length);
  // 柱子和区间柱都要同一把尺子
  const nmax = Math.max(...gs.map(g => g.prices.length), 1);
  const amin = Math.min(...gs.flatMap(g => g.prices).filter(v => v > 0), 0.01);
  const amax = Math.max(...gs.flatMap(g => g.prices), 1);
  document.getElementById('aggs').innerHTML = gs.map(g => {
    const min = Math.min(...g.prices), max = Math.max(...g.prices);
    return `<div class="card">
      ${logo('', g.name)}
      <div class="name">${g.name}${g.free ? `<span class="tag ok">${g.free} 个 0 元档</span>` : ''}</div>
      <div class="row"><span class="nm">上架模型</span>${bar(g.prices.length / nmax * 100, g.prices.length)}</div>
      ${rangeBar(logPct(min, amin, amax), logPct(max, amin, amax), 0, 100)}
      <div class="kv"><b>${money(min)}</b> ~ <b>${money(max)}</b> <span class="unit">/ 1M 输入</span>${
        g.latest ? `　<span class="dim">最近 ${g.latest}</span>` : ''}</div>
      <a href="index.html?vendor=${encodeURIComponent(g.name)}">在总表里看 →</a>
      ${pages[g.name] ? `<a href="${pages[g.name]}" target="_blank" rel="noopener">官方定价页 ↗</a>` : ''}
    </div>`;
  }).join('');
});
</script>
</body>
</html>
