<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模型评测 — LLM 价格对比</title>
<link rel="stylesheet" href="style.css">
<style>
  .boards { max-width:var(--max); margin:12px auto 0; padding:0 20px;
            display:flex; gap:8px; flex-wrap:wrap; }
  .boards button { padding:7px 14px; border-radius:20px; font-size:13px; cursor:pointer;
            background:var(--card); border:1px solid var(--line); color:var(--fg);
            font-family:inherit; }
  .boards button:hover { border-color:var(--accent); color:var(--accent); }
  .boards button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .boards { flex-direction:column; align-items:stretch; gap:6px; }
  .catrow { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .catrow .eyebrow { min-width:76px; letter-spacing:.06em; }
  .boards button.wide { font-weight:700; }
  .about { max-width:var(--max); margin:14px auto 0; padding:0 20px;
           color:var(--dim); font-size:13px; }
  .about a { text-decoration:none; }
  .bad { color:#b91c1c; }
  .good { color:#15803d; }
</style>
</head>
<body>
<div class="hero">
<header>
  <div class="eyebrow">BENCHMARKS</div>
  <h1>模型<em>评测</em></h1>
  <div class="meta">数据来自 <a href="https://epoch.ai/benchmarks" target="_blank">Epoch AI</a> 与 <a href="https://github.com/vectara/hallucination-leaderboard" target="_blank">Vectara</a>，非本站自测 · 抓取于 <span id="updated">…</span></div>
</header>
<nav></nav>
</div>
<div class="boards" id="boards"></div>
<p class="about" id="about"></p>
<div class="bar">
  <input id="q" type="search" placeholder="搜模型名…">
  <select id="age">
    <option value="1">仅近两年发布的模型</option>
    <option value="">全部（含早期模型）</option>
  </select>
</div>
<div class="chart" id="chart" style="display:none"></div>
<p class="count" id="count"></p>
<table id="tbl"><thead><tr id="head"></tr></thead><tbody></tbody></table>
<p class="note">跨榜单分数不可直接比（题目、评分方式、Agent 框架都不同）。同一模型多档推理强度只留最高分。数据 CC-BY 4.0。</p>

<script src="app.js?v=8"></script>
<script>
let boards = [], cur = 0, sortKey = null, sortAsc = false;


fetch('data/bench.json').then(r => r.json()).then(d => {
  boards = d.boards;
  document.getElementById('updated').textContent = d.updated_at;
  // 榜单多了，按分类分行摆，不然一排按钮糊成一片
  const ovi = boards.findIndex(b => b.id === 'overview');
  const cats = [...new Set(boards.filter(b => b.id !== 'overview').map(b => b.cat || '其他'))];
  document.getElementById('boards').innerHTML =
    (ovi >= 0 ? `<div class="catrow"><span class="eyebrow">一眼看强弱</span>
       <button data-i="${ovi}" class="wide">${boards[ovi].name}</button></div>` : '') +
    cats.map(c => `<div class="catrow"><span class="eyebrow">${c}</span>` +
      boards.map((b, i) => b.id === 'overview' || (b.cat || '其他') !== c ? ''
        : `<button data-i="${i}">${b.name}</button>`).join('') + '</div>').join('');
  document.querySelectorAll('.boards button').forEach(btn =>
    btn.onclick = () => { cur = +btn.dataset.i; sortKey = null; render(); });
  render();
});
['q','age'].forEach(id => document.getElementById(id).addEventListener('input', render));

function render() {
  const b = boards[cur];
  document.querySelectorAll('.boards button').forEach(btn =>
    btn.classList.toggle('on', +btn.dataset.i === cur));
  document.getElementById('about').innerHTML = `${b.desc}
    来源：<a href="${b.url}" target="_blank">${b.source}</a>
    · 榜单内最新模型发布于 <b>${b.latest || '未知'}</b>`;

  // 默认按榜单主指标排序，幻觉率这类越低越好的在数据里标了 asc
  const main = b.cols[0];
  const key = sortKey || main.k;
  const asc = sortKey ? sortAsc : !!main.asc;
  const q = document.getElementById('q').value.toLowerCase();
  const hideOld = document.getElementById('age').value;
  const rs = b.rows
    .filter(r => (!q || r.model.toLowerCase().includes(q)) && (!hideOld || !r.old))
    .sort((x, y) => {
      let a = x[key], c = y[key];
      if (a == null) return 1; if (c == null) return -1;
      if (typeof a === 'number') return asc ? a - c : c - a;
      return asc ? String(a).localeCompare(c) : String(c).localeCompare(a);
    });

  // 每列的最大值，柱子长度按它缩放
  const colMax = {};
  for (const c of b.cols) if (c.num)
    colMax[c.k] = Math.max(...rs.map(r => r[c.k] ?? 0), 0);

  document.getElementById('head').innerHTML = '<th class="rank">#</th><th>模型</th>' +
    b.cols.map(c => `<th data-k="${c.k}" class="${c.num ? 'num' : ''}">${c.t}</th>`).join('') +
    '<th data-k="released">模型发布</th>';
  document.querySelectorAll('#head th[data-k]').forEach(th =>
    th.onclick = () => {
      const k = th.dataset.k;
      sortAsc = sortKey === k ? !sortAsc : false; sortKey = k; render();
    });

  // 榜首十名单独画一张横向柱状图：先看图，要细节再往下看表
  const mx = Math.max(...rs.map(r => r[main.k] ?? 0), 1);
  document.getElementById('chart').style.display = rs.length ? '' : 'none';
  document.getElementById('chart').innerHTML =
    `<h3>前十名 · ${main.t}<small>${b.name}</small></h3>` +
    rs.slice(0, 10).map((r, i) => `<div class="row">
      <span class="nm" title="${r.model}">${i + 1}. ${r.model}</span>
      ${bar((r[main.k] ?? 0) / mx * 100, r[main.k] ?? '·', i)}</div>`).join('');

  const hidden = b.rows.length - rs.length;
  document.getElementById('count').textContent =
    `${rs.length} 个模型` + (hidden && hideOld ? `，已隐藏 ${hidden} 个发布超两年的模型` : '');
  document.querySelector('#tbl tbody').innerHTML = rs.map((r, i) =>
    `<tr><td class="rank${i < 3 ? ' top' : ''}">${i + 1}</td><td>${r.model}</td>` +
    b.cols.map(c => {
      const v = r[c.k];
      if (v == null || v === '') return '<td class="na">·</td>';
      if (!c.num) return `<td class="v">${v}</td>`;
      // 数值列一律画柱子：百分比按 100 满格，其余（Elo、分钟、成本）按本列最大值缩放
      const max = c.pct ? 100 : (colMax[c.k] || 1);
      return `<td class="num">${bar(v / max * 100, v, i < 3 ? i : 9)}</td>`;
    }).join('') +
    `<td class="v">${r.released || '<span class="na">-</span>'}</td></tr>`).join('');
}
</script>
</body>
</html>
